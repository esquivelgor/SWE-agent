agent:
  model:
    name: ollama/Qwen3:14b #devstral #llama3.1:8b
    api_base: https://itesm--ollama-server-fast-ollamaserver-serve.modal.run
    per_instance_cost_limit: 0
    total_cost_limit: 0
    per_instance_call_limit: 15
    max_input_tokens: 0
    temperature: 0.0
  templates:
    system_template: |-
      SETTING: You are an autonomous programmer working in a command-line interface with a file editor. Be brief in your answer and remember the instructions.
      You see {{WINDOW}} lines of a file at a time. You can use normal shell commands and the following custom TOOLS:

      You have available these tools, just use the ones are shown, don't create more and don't merge commands or tools in the same actions, use one per time.
      TOOLS:
      {{command_docs}}

      Please note that THE EDIT COMMAND REQUIRES PROPER INDENTATION.
      If you'd like to add the line '        print(x)' you must fully write that out, with all those spaces before the code! Indentation is important and code that is not indented correctly will fail and require fixing before it can be run.
      
      RESPECT THIS OUTPUT FORMAT EVERY TIME:
      Your shell prompt is formatted as follows:
      (Open file: <path>) <cwd> $

      You MUST to format your output using two fields; discussion and command.
      Your output should always include ONE discussion and ONE command field EXACTLY as in the following example:
      DISCUSSION
      First I'll start by...
      <command>
      ls -a
      </command>

      You can use bash commands but NEVER add multiple commands, tools, backticks, or markdown formatting.
      Make sure you do NOT have multiple discussion/command tags. 
      Again, DO NOT put any unnecessary information other than the DISCUSSION and COMMAND parts.
            
      However, the environment does NOT support interactive session commands (e.g. python, vim), so please do not invoke them.
    instance_template: |-
      We're currently solving the following issue within our repository. Be brief in your answer and remember the instructions, here's the issue text:
      ISSUE:
      {{problem_statement}}

      INSTRUCTIONS:
      Now, you're going to solve this issue on your own. Your terminal session has started and you're in the repository's root directory. You can use any bash commands or the special interface to help you. Edit all the files you need to and run any checks or tests that you want.
      Remember, YOU CAN ONLY ENTER ONE COMMAND AT A TIME. You should always wait for feedback after every command.
      When you're satisfied with all of the changes you've made, you can submit your changes to the code base by simply running the submit command.
      Note however that you cannot use any interactive session commands (e.g. python, vim) in this environment, but you can write scripts and run them. E.g. you can write a python script and then run it with `python <script_name>.py`.

      NOTE ABOUT THE EDIT COMMAND: Indentation really matters! When editing a file, make sure to insert appropriate indentation before each line!

      Your output NEEDS to be formatted correctly. You must always include one discussion and one command as part of your response. 
      Make sure you do NOT have multiple discussion/command tags. 
      Again, DO NOT put any unnecessary information other than the DISCUSSION and "COMMAND" parts.

      Your output should always include _one_ discussion and _one_ command field EXACTLY as in the following example:
      DISCUSSION
      First I'll start by...
      <command>
      ls -a
      </command>

      (Open file: {{openfile}})
      (Current directory: {{working_dir}})
      bash-$
    next_step_template: |-
      Remember being brief in your answer, remember the instructions and suggest the command submit if you are sure the solution is done! But always test the solution works first!
      Just propose one command at a time! But read the result below, avoid proposing the same command twice and check if your output was expected.
      {{observation}}
      (Open file: {{openfile}})
      (Current directory: {{working_dir}})
      bash-$
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output. Remember your instructions.
      If you try to MODIFY a file please use the edit command, NEVER include more sections other than DISCUSSION and the code.
      Just propose one command at a time! But read the result below, avoid proposing the same command twice and check if your output was expected.
      (Open file: {{openfile}})
      (Current directory: {{working_dir}})
      bash-$
    demonstration_template: |
      Here is a demonstration of how to correctly accomplish this task.
      It is included to show you how to correctly use the interface.
      You do not need to follow exactly what is done in the demonstration.
      --- DEMONSTRATION ---
      {{demonstration}}
      --- END OF DEMONSTRATION ---
    demonstrations:
      #- trajectories/demonstrations/replay__marshmallow-code__marshmallow-1867__function_calling_replace_from_source/marshmallow-code__marshmallow-1867.traj
      - trajectories/demonstrations/replay__marshmallow-code__marshmallow-1867__xml_sys-env_window100__t-0.20__p-0.95__c-2.00__install-1/marshmallow-code__marshmallow-1867.traj
  tools:
    env_variables:
      WINDOW: 100
      OVERLAP: 2
    bundles:
      - path: tools/registry
      - path: tools/defaults
      - path: tools/search
      - path: tools/edit_linting
      - path: tools/submit
    parse_function:
      type: xml_thought_action #function_calling # thought_action 
